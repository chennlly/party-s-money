<style>
  /* ===== 設定字體：微軟正黑體 ===== */
  :root{
    --font: "Microsoft JhengHei", "微軟正黑體", "PingFang TC", "Heiti TC", "Noto Sans TC", sans-serif;

    --bg:        #F6F1EA;
    --bg-soft:   #FBF7F1;
    --card:     #FFFFFF;
    --ink:      #3A3530;
    --ink-soft: #7A726A;
    --ink-mute: #B5ADA3;
    --line:     #ECE4D9;
    --line-2:   #E0D6C6;

    /* 主色系：英短藍貓灰 + 奶油桃 */
    --cat:      #9BA6B4;
    --cat-deep: #6E7A8B;
    --cat-soft: #D7DCE3;
    --peach:    #F4B89A;
    --peach-deep:#E89570;
    --pink:     #F2C7C2;

    --ok:       #8FBF9F;
    --warn:     #E58F8F;

    --shadow: 0 4px 18px rgba(110,122,139,0.10), 0 1px 3px rgba(110,122,139,0.06);
    --radius: 16px;
    --radius-sm: 10px;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);}
  body{
    min-height:100dvh;
    background:
      radial-gradient(1200px 600px at 90% -100px, #FCE7DA 0%, transparent 60%),
      radial-gradient(900px 500px at -100px 100%, #DDE3EC 0%, transparent 55%),
      var(--bg);
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{font-family:inherit;color:inherit}
  a{color:var(--cat-deep)}

  /* ===== Layout ===== */
  .wrap{max-width: 980px; margin: 0 auto; padding: 28px 20px 80px;}
  header.top{
    display:flex; align-items:center; gap:16px;
    padding: 18px 22px;
    background: linear-gradient(135deg, #FFFFFF 0%, #FBF7F1 100%);
    border:1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
  }
  .title{
    display:flex; align-items:center; gap:14px;
    flex:1; min-width:0;
  }
  .title h1{
    margin:0; font-size: 22px; letter-spacing: 1px;
    font-weight: 800; color: var(--ink);
  }
  .title .sub{
    font-size: 12px; color: var(--ink-soft); margin-top:2px; letter-spacing:.5px;
  }
  /* ===== Cards ===== */
  .card{
    background: var(--card);
    border:1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
    margin-bottom: 18px;
  }
  .card h2{
    margin: 0 0 14px;
    font-size: 15px; letter-spacing: 1.5px;
    color: var(--ink-soft); font-weight: 800;
    display:flex; align-items:center; gap:8px;
  }
  .card h2::before{
    content:""; width:6px; height:6px; border-radius:50%;
    background: var(--peach-deep);
  }

  /* ===== Form ===== */
  .form-grid{
    display:grid;
    grid-template-columns: repeat(12, 1fr);
    gap: 12px;
  }
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:12px; color:var(--ink-soft); letter-spacing:.5px}
  .field input[type="text"], .field input[type="number"], .field input[type="date"]{
    border:1px solid var(--line-2);
    background: var(--bg-soft);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 15px;
    transition: border .15s, background .15s;
  }
  .field input:focus{outline:none;border-color: var(--cat); background:#fff;}
  .col-3{grid-column: span 3}
  .col-4{grid-column: span 4}
  .col-5{grid-column: span 5}
  .col-6{grid-column: span 6}
  .col-8{grid-column: span 8}
  .col-12{grid-column: span 12}
  @media (max-width:720px){
    .col-3,.col-4,.col-5,.col-6,.col-8{grid-column: span 12}
  }

  /* people pill row */
  .people{
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .pill{
    display:inline-flex; align-items:center; gap:6px;
    padding: 8px 12px; border-radius: 999px;
    background:#fff; border:1px solid var(--line-2); color:var(--ink-soft);
    font-size:14px; font-weight:600; user-select:none; cursor:pointer;
    transition: all .15s;
  }
  .pill:hover{border-color: var(--cat)}
  .pill .dot{width:8px;height:8px;border-radius:50%; background:var(--cat-soft)}
  .pill.on{background: var(--cat-deep); color:#fff; border-color: var(--cat-deep);}
  .pill.on .dot{background:#fff}
  .pill.payer.on{background: var(--peach-deep); border-color: var(--peach-deep);}

  /* button */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    background: var(--ink); color:#fff; border-radius: 12px;
    padding: 12px 18px; font-weight: 800; font-size: 14px; letter-spacing:1px;
    transition: transform .08s, box-shadow .15s, background .15s;
    box-shadow: 0 4px 0 #2a2620;
  }
  .btn:hover{transform: translateY(-1px)}
  .btn:active{transform: translateY(1px); box-shadow: 0 2px 0 #2a2620;}
  .btn.primary{background: var(--peach-deep); box-shadow: 0 4px 0 #c4744f;}
  .btn.primary:active{box-shadow: 0 2px 0 #c4744f}
  .btn.ghost{background:#fff; color:var(--ink); border:1px solid var(--line-2); box-shadow:none;}
  .btn.ghost:hover{border-color: var(--cat)}
  .btn.small{padding:8px 12px; font-size:12px; box-shadow:none; border-radius:10px}
  .btn.danger{background: var(--warn); box-shadow: 0 4px 0 #b76a6a}
  .btn.ok{background: var(--ok); box-shadow: 0 4px 0 #6fa182}

  /* ===== Expense list ===== */
  .list{display:flex; flex-direction:column; gap:10px}
  .row{
    display:grid;
    grid-template-columns: 90px 1fr auto auto;
    gap: 12px;
    align-items:center;
    background: var(--bg-soft);
    border:1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    transition: opacity .15s;

  .row.paid .desc{text-decoration: line-through;}
  .row .date{font-size:12px; color:var(--ink-soft); letter-spacing:.5px}
  .row .desc{font-weight:700; font-size:15px}
  .row .meta{font-size:12px; color:var(--ink-soft); margin-top:3px}
  .row .meta b{color:var(--cat-deep); font-weight:700}
  .row .amount{font-weight: 800; font-size: 18px; color:var(--peach-deep); letter-spacing:.5px}
  .row .acts{display:flex; gap:6px}
  .row .acts .btn.small{box-shadow:none}
  @media (max-width:640px){
    .row{grid-template-columns: 1fr auto; gap:6px}
    .row .date{grid-column: 1 / -1; order:-1}
    .row .acts{grid-column: 1 / -1; justify-content: flex-end}

  .empty{
    text-align:center; padding: 36px 12px; color: var(--ink-soft);
    border:2px dashed var(--line-2); border-radius: 16px;
    background: var(--bg-soft);

  /* ===== Settle Section ===== */
  .balance-grid{

  .balance-card .num{font-size:20px; font-weight:800; letter-spacing:.5px}
  .num.pos{color: var(--ok)}
  .num.neg{color: var(--warn)}

  .debts{display:flex; flex-direction:column; gap:10px; margin-top:14px}
  .debt-row{
    display:flex; align-items:center; gap:12px;
    background: var(--bg-soft);
    border:1px solid var(--line);
    border-radius: 12px; padding: 12px 14px;
  }
  .debt-row .text{flex:1; font-size:14px}
  .debt-row .text b{color: var(--cat-deep); font-weight:800}
  .debt-row .amt{font-weight:800; color: var(--peach-deep); font-size:16px}
  .all-clear{
    display:flex; align-items:center; gap:12px;
    background: linear-gradient(135deg, #EFFAF1 0%, #FAF7F1 100%);
    border:1px dashed var(--ok); border-radius: 12px; padding: 14px;
    color:#4f7a5b; font-weight:700;
  }

  /* ===== Toggle paid filter ===== */
  .toolbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    margin-bottom: 12px;
  }
  .seg{
    display:inline-flex; background:#fff; border:1px solid var(--line-2); border-radius:999px;
    padding:4px; gap:2px;
  }
  .seg button{
    padding: 6px 12px; border-radius: 999px; font-size:12px; font-weight:700;
    color: var(--ink-soft);
  }
  .seg button.on{background: var(--cat-deep); color:#fff}
  .grow{flex:1}

  /* tag for paid status */
  .tag{display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; background:var(--cat-soft); color:var(--cat-deep); font-weight:700; letter-spacing:.5px}
  .tag.paid{background:#E2F1E5; color:#4f7a5b}

  /* Footer */
  footer.foot{
    text-align:center; color:var(--ink-mute); font-size:12px;
    margin-top: 30px; letter-spacing:1px;
  }

  /* Modal */
  .modal-bg{
    position:fixed; inset:0; background:rgba(58,53,48,.4); backdrop-filter: blur(2px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:16px;
  }
  .modal-bg.on{display:flex}
  .modal{
    background:#fff; border-radius: 18px; padding: 22px; max-width: 440px; width:100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.2);
  }
  .modal h3{margin:0 0 10px; font-size:18px}
  .modal p{color:var(--ink-soft); font-size:14px; line-height: 1.6; margin:0 0 16px}
  .modal-acts{display:flex; gap:8px; justify-content:flex-end}

  /* Cute floating cat — 點擊回到最上面 */
  .corner-cat{
    position:fixed; right:18px; bottom:18px; width:86px; height:86px;
    z-index: 50; opacity:.95;
    filter: drop-shadow(0 6px 10px rgba(110,122,139,.25));
    animation: bob 4s ease-in-out infinite;
    background:none; border:0; padding:0;
    cursor:pointer;
    transition: transform .15s, opacity .15s;
  }
  .corner-cat:hover{
    opacity:1; transform: translateY(-3px) scale(1.05);
  }
  .corner-cat:active{
    transform: translateY(0) scale(0.95);
  }
  .corner-cat img{
    width:100%; height:100%; object-fit:contain; display:block;
    pointer-events:none;
  }
  .corner-cat::after{
    content: "回頂端 ↑";
    position:absolute; bottom: 100%; left:50%; transform:translateX(-50%);
    background: var(--ink); color:#fff;
    font-size: 11px; font-weight:700; padding: 4px 8px; border-radius: 8px;
    white-space:nowrap;
    opacity:0; pointer-events:none;
    transition: opacity .15s;
    margin-bottom: 4px;
  }
  .corner-cat:hover::after{ opacity:1; }
  @keyframes bob{
    0%,100%{transform: translateY(0) rotate(-2deg)}
    50%{transform: translateY(-6px) rotate(2deg)}
  }
  @media (max-width:640px){ .corner-cat{width:64px;height:64px} }
</style>

<!-- ============ APP SCRIPT ============ -->
<script>
/* =========================================================
   ⚙️  Supabase 設定（請改成你的）
   1. 打開 https://supabase.com → 你的 Project → Settings → API
   2. 把 Project URL 和 anon public key 貼到下面
   3. 到 SQL Editor 執行 README.md 提供的建表 SQL
   ========================================================= */
const SUPABASE_URL = "https://smrlccrllvghvvnczeju.supabase.co";
const SUPABASE_KEY = "sb_publishable_YH_D-hPchUL5gTrEa-HA-A_00lpmebp";

const MEMBERS = ["Mavis","Apple","Kerry"];

/* =========================================================
   State + Supabase client
   ========================================================= */
let supa = null;
let expenses = [];           // local cache
let filter = "all";          // 'all' | 'open' | 'paid'

const usingRemote = !SUPABASE_URL.includes("YOUR-PROJECT") && !SUPABASE_KEY.includes("YOUR-ANON");
if(usingRemote){
  supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

/* =========================================================
   Helpers
   ========================================================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const todayStr = () => {
  const d = new Date();
  const tz = d.getTimezoneOffset()*60000;
  return new Date(d - tz).toISOString().slice(0,10);
};
const fmtMoney = n => "NT$ " + Math.round(n).toLocaleString();
const uid = () => crypto.randomUUID();

/* localStorage fallback when supabase not configured */
const LS_KEY = "rent-split-data-v1";
const lsLoad = () => { try{ return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); }catch(e){ return []; } };
const lsSave = (arr) => localStorage.setItem(LS_KEY, JSON.stringify(arr));

/* =========================================================
   Data layer
   ========================================================= */
async function loadAll(){
  if(usingRemote){
    const { data, error } = await supa.from("expenses")
      .select("*")
      .order("date", { ascending:false })
      .order("created_at", { ascending:false });
    if(error){ alert("讀取失敗：" + error.message); expenses=[]; return; }
    expenses = data || [];
  }else{
    expenses = lsLoad();
  }
  render();
}

async function addExpense(row){
  if(usingRemote){
    const { data, error } = await supa.from("expenses").insert(row).select().single();
    if(error){ alert("新增失敗：" + error.message); return; }
    // realtime will fill in, but also do an optimistic update
    if(!expenses.find(x=>x.id===data.id)) expenses.unshift(data);
  }else{
    row.id = uid();
    row.created_at = new Date().toISOString();
    expenses.unshift(row);
    lsSave(expenses);
  }
  render();
}

async function updateExpense(id, patch){
  if(usingRemote){
    const { error } = await supa.from("expenses").update(patch).eq("id", id);
    if(error){ alert("更新失敗：" + error.message); return; }
  }
  const ix = expenses.findIndex(x=>x.id===id);
  if(ix>=0) expenses[ix] = { ...expenses[ix], ...patch };
  if(!usingRemote) lsSave(expenses);
  render();
}

async function deleteExpense(id){
  if(usingRemote){
    const { error } = await supa.from("expenses").delete().eq("id", id);
    if(error){ alert("刪除失敗：" + error.message); return; }
  }
  expenses = expenses.filter(x=>x.id!==id);
  if(!usingRemote) lsSave(expenses);
  render();
}

async function settleAll(){
  const openIds = expenses.filter(x=>!x.paid).map(x=>x.id);
  if(openIds.length===0) return;
  if(usingRemote){
    const { error } = await supa.from("expenses").update({ paid:true }).in("id", openIds);
    if(error){ alert("結清失敗：" + error.message); return; }
  }
  expenses = expenses.map(x => openIds.includes(x.id) ? {...x, paid:true} : x);
  if(!usingRemote) lsSave(expenses);
  render();
}

/* Realtime subscribe */
function subscribeRealtime(){
  if(!usingRemote) return;
  supa.channel("expenses-rt")
    .on("postgres_changes", { event:"*", schema:"public", table:"expenses" }, payload => {
      // Simple approach: refetch on any change
      loadAll();
    })
    .subscribe();
}

/* =========================================================
   Balance calculation
   ========================================================= */
function computeBalances(){
  // Each person's net = (paid for others) - (owes from others)
  const net = Object.fromEntries(MEMBERS.map(m => [m, 0]));
  // pairwise: pair[a][b] = how much a owes b (positive)
  const pair = {};
  for(const a of MEMBERS){ pair[a] = {}; for(const b of MEMBERS){ pair[a][b] = 0; } }

  for(const e of expenses){
    if(e.paid) continue;
    const parts = (e.participants || []);
    if(parts.length === 0) continue;
    const share = Number(e.amount) / parts.length;
    for(const p of parts){
      if(p === e.payer) continue;
      // p owes e.payer `share`
      pair[p][e.payer] += share;
    }
  }
  // Net out reciprocal debts: if A owes B 100 and B owes A 30 → A owes B 70
  for(let i=0;i<MEMBERS.length;i++){
    for(let j=i+1;j<MEMBERS.length;j++){
      const a = MEMBERS[i], b = MEMBERS[j];
      const ab = pair[a][b], ba = pair[b][a];
      if(ab > ba){ pair[a][b] = ab - ba; pair[b][a] = 0; }
      else      { pair[b][a] = ba - ab; pair[a][b] = 0; }
    }
  }
  // Compute net for display
  for(const a of MEMBERS){
    let owe = 0, owed = 0;
    for(const b of MEMBERS){ if(a===b) continue; owe += pair[a][b]; owed += pair[b][a]; }
    net[a] = owed - owe;
  }
  return { net, pair };
}

/* =========================================================
   Render
   ========================================================= */
function render(){
  renderForm();
  renderBalances();
  renderList();
}

function renderForm(){
  // initialize once
  if(!$("#f-date").value){
    $("#f-date").value = todayStr();
  }
  // 不預設付款人；分帳對象預設三人都勾
  if(!$("#f-payer").dataset.init){
    $$(".pill.share").forEach(p => p.classList.add("on"));
    $("#f-payer").dataset.init = "1";
  }
}

function setPayer(name){
  $$(".pill.payer").forEach(p => p.classList.toggle("on", p.dataset.name === name));
}
function getPayer(){
  const on = $(".pill.payer.on");
  return on ? on.dataset.name : null;
}
function getShare(){
  return $$(".pill.share.on").map(p => p.dataset.name);
}

function renderBalances(){
  const { net, pair } = computeBalances();
  // 3 cards
  const grid = $("#balance-grid");
  grid.innerHTML = MEMBERS.map(m => {
    const v = net[m];
    const cls = Math.abs(v) < 0.5 ? "zero" : (v > 0 ? "pos" : "neg");
    const sign = v > 0 ? "+" : "";
    const label = Math.abs(v) < 0.5 ? "持平 ✓" : (v > 0 ? "別人欠他" : "他要還錢");
    return `
      <div class="balance-card">
        <div class="avatar">${avatarSvg(m)}</div>
        <div style="flex:1; min-width:0">
          <div class="who">${m}</div>
          <div style="font-size:11px;color:var(--ink-mute);letter-spacing:.5px">${label}</div>
          <div class="num ${cls}">${sign}${fmtMoney(v)}</div>
        </div>
      </div>`;
  }).join("");

  // debt rows
  const rows = [];
  for(const a of MEMBERS){
    for(const b of MEMBERS){
      if(a===b) continue;
      const v = pair[a][b];
      if(v > 0.5){
        rows.push({ from:a, to:b, amt:v });
      }
    }
  }
  const debts = $("#debts");
  if(rows.length === 0){
    debts.innerHTML = `<div class="all-clear">✨ 沒有人欠誰錢，乾乾淨淨～</div>`;
  }else{
    debts.innerHTML = rows.map(r => `
      <div class="debt-row">
        <div class="text"><b>${r.from}</b> 要還 <b>${r.to}</b></div>
        <div class="amt">${fmtMoney(r.amt)}</div>
      </div>
    `).join("");
  }
}

function avatarSvg(name){
  // 使用者提供的 PNG 頭像
  const initial = (name || "?").slice(0,1).toUpperCase();
  return `<img src="${encodeURIComponent(name)}.png" alt="${name}"
          onerror="this.outerHTML='<div class=&quot;avatar-fallback&quot;>${initial}</div>'">`;
}

function renderList(){
  const list = $("#list");
  let items = expenses;
  if(filter === "open") items = items.filter(x => !x.paid);
  if(filter === "paid") items = items.filter(x =>  x.paid);

  $("#count").textContent = `共 ${items.length} 筆`;

  if(items.length === 0){
    list.innerHTML = `<div class="empty">還沒有帳目，新增第一筆吧 🐱</div>`;
    return;
  }

  list.innerHTML = items.map(e => {
    const parts = (e.participants || []).join("、");
    const share = e.participants?.length ? (Number(e.amount)/e.participants.length) : 0;
    return `
      <div class="row ${e.paid ? 'paid':''}">
        <div class="date">${formatDate(e.date)}</div>
        <div>
          <div class="desc">${escapeHtml(e.description || "(無說明)")}</div>
          <div class="meta">
            <b>${e.payer}</b> 先付 · 分給 <b>${parts}</b>
            · 每人 ${fmtMoney(share)}
            ${e.paid ? '<span class="tag paid" style="margin-left:6px">已結清</span>' : ''}
          </div>
        </div>
        <div class="amount">${fmtMoney(e.amount)}</div>
        <div class="acts">
          ${e.paid
            ? `<button class="btn ghost small" data-act="unpaid" data-id="${e.id}">↩ 取消結清</button>`
            : `<button class="btn ok small" data-act="paid" data-id="${e.id}">✓ 結清</button>`}
          <button class="btn ghost small" data-act="del" data-id="${e.id}">✕</button>
        </div>
      </div>
    `;
  }).join("");
}

function formatDate(s){
  if(!s) return "";
  const [y,m,d] = s.split("-");
  return `${parseInt(m)}/${parseInt(d)}`;
}
function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

/* =========================================================
   Event wiring
   ========================================================= */
// payer pills (single select)
$("#f-payer").addEventListener("click", e => {
  const b = e.target.closest(".pill.payer"); if(!b) return;
  setPayer(b.dataset.name);
});
// share pills (multi)
$("#f-share").addEventListener("click", e => {
  const b = e.target.closest(".pill.share"); if(!b) return;
  b.classList.toggle("on");
});
$("#f-quick-all").addEventListener("click", () => {
  $$(".pill.share").forEach(p => p.classList.add("on"));
});

// add expense
$("#f-add").addEventListener("click", async () => {
  const date = $("#f-date").value;
  const desc = $("#f-desc").value.trim();
  const amt  = parseFloat($("#f-amount").value);
  const payer = getPayer();
  const share = getShare();

  if(!date){ alert("選個日期吧～"); return; }
  if(!desc){ alert("買了什麼？填一下吧"); return; }
  if(!amt || amt<=0){ alert("金額要 > 0"); return; }
  if(!payer){ alert("選擇誰先付的錢"); return; }
  if(share.length===0){ alert("勾選分帳的人"); return; }

  await addExpense({
    date, description: desc, amount: amt,
    payer, participants: share, paid: false
  });

  // reset form (keep payer = me, keep share state)
  $("#f-desc").value = "";
  $("#f-amount").value = "";
  $("#f-date").value = todayStr();
});

// list actions
$("#list").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]"); if(!b) return;
  const id = b.dataset.id;
  const act = b.dataset.act;
  if(act === "paid")   updateExpense(id, { paid:true });
  if(act === "unpaid") updateExpense(id, { paid:false });
  if(act === "del"){
    openConfirm("刪除帳目", "確定要刪除這筆嗎？刪了不能還原。", () => deleteExpense(id));
  }
});

// filter seg
$("#filter-seg").addEventListener("click", e => {
  const b = e.target.closest("button[data-f]"); if(!b) return;
  filter = b.dataset.f;
  $$("#filter-seg button").forEach(x => x.classList.toggle("on", x===b));
  renderList();
});

// settle all
$("#settle-all").addEventListener("click", () => {
  const openCount = expenses.filter(x=>!x.paid).length;
  if(openCount === 0){ alert("已經沒有未結清的帳了 🎉"); return; }
  openConfirm("全部結清", `要把 ${openCount} 筆未結清的帳全部標記為已還嗎？\n（不會刪除紀錄，只是打勾）`, settleAll);
});

// confirm modal
function openConfirm(title, msg, onOk){
  $("#m-title").textContent = title;
  $("#m-msg").textContent = msg;
  $("#modal").classList.add("on");
  const ok = $("#m-ok"); const cancel = $("#m-cancel"); const bg = $("#modal");
  const close = () => { bg.classList.remove("on"); ok.onclick=null; cancel.onclick=null; bg.onclick=null; };
  ok.onclick = () => { close(); onOk(); };
  cancel.onclick = close;
  bg.onclick = ev => { if(ev.target === bg) close(); };
}

/* =========================================================
   Boot
   ========================================================= */
loadAll();
subscribeRealtime();
</script>
</body>
</html>
